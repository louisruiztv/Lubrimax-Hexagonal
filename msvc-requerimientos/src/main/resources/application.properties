spring.application.name=msvc-requerimientos
server.port=8014

spring.datasource.url=jdbc:mysql://localhost:3306/msvc_requerimientos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true

logging.level.org.hibernate.SQL=debug

clients.ordenes.url=${ORDENES_URL:http://localhost:8013}
clients.productos.url=${PRODUCTOS_URL:http://localhost:8011}
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000


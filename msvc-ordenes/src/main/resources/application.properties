spring.application.name=msvc-ordenes
server.port=8013

spring.datasource.url=jdbc:mysql://localhost:3306/msvc_ordenes?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true

logging.level.org.hibernate.SQL=debug

clients.vehiculos.url=${VEHICULOS_URL:http://localhost:8010}
clients.servicios.url=${SERVICIOS_URL:http://localhost:8012}
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000


clients.ejecucion.url=${EJECUCION_URL:http://localhost:8015}
